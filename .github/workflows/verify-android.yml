name: Verify Android

on:
  push:
    branches:
      - feature/extensions-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # A non-secret CI-only Firebase config lets the Google Services Gradle
      # plugin process the debug variant. It is not used for a release build.
      - name: Create CI-only Google Services config
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "lastnap-ci",
              "storage_bucket": "lastnap-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.lastnap.app.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-only-not-a-real-api-key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastnap-unit-test-reports
          path: app/build/reports/tests/testGithubDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Assemble debug APK
        if: success()
        run: ./gradlew --no-daemon assembleGithubDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastnap-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Run Android lint
        if: success()
        run: ./gradlew --no-daemon lintGithubDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastnap-lint-reports
          path: |
            app/build/reports/lint-results-githubDebug.*
            app/build/intermediates/lint_intermediate_text_report/githubDebug/lintReportGithubDebug/
          if-no-files-found: warn
          retention-days: 7
