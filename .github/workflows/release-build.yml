name: Build LastNap Release APK

on:
  push:
    branches:
      - feature/extensions-foundation
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "web-ui/**"
      - ".github/workflows/release-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lastnap-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare release signing and Google Services
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64" || { echo "KEY_BASE64 secret is missing"; exit 1; }
          test -n "$SIGNING_CONFIG" || { echo "SIGNING_CONFIG secret is missing"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON" || { echo "GOOGLE_SERVICES_JSON secret is missing"; exit 1; }
          printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/app.key
          test -s local.properties
          test -s app/google-services.json

      - name: Run release unit tests and assemble optimized ARM64 release
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testGithubReleaseUnitTest assembleGithubRelease

      - name: Verify and prepare ARM64 APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$apk" || { echo "ARM64 release APK was not produced"; exit 1; }
          mkdir -p release-assets
          cp "$apk" release-assets/LastNap-3.1.2-arm64-v8a.apk

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$apksigner" || { echo "Android apksigner was not found"; exit 1; }
          "$apksigner" verify --verbose --print-certs release-assets/LastNap-3.1.2-arm64-v8a.apk

          size="$(stat -c '%s' release-assets/LastNap-3.1.2-arm64-v8a.apk)"
          sha="$(sha256sum release-assets/LastNap-3.1.2-arm64-v8a.apk | cut -d ' ' -f1)"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### LastNap 3.1.2 — ARM64 release"
            echo ""
            echo "- Signed release APK: verified by apksigner"
            echo "- Size: $size bytes"
            echo "- SHA-256: `$sha`"
            echo "- ABI: arm64-v8a"
            echo "- Build: R8-optimized release variant with the committed Baseline Profile"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: LastNap-3.1.2-arm64-v8a
          path: release-assets/LastNap-3.1.2-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: LastNap-3.1.2-r8-mapping
          path: app/build/outputs/mapping/githubRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 14
