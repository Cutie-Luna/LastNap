name: Custom Tool API Runtime Verification

on:
  push:
    branches:
      - feature/custom-tool-api-runtime-next

permissions:
  contents: read

concurrency:
  group: custom-tool-api-runtime-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Provide CI-only Google Services configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "lastnap-ci",
              "storage_bucket": "lastnap-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.lastnap.app.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {}
              }
            ]
          }
          EOF

      - name: Run custom-tool, HTTP runtime, search regression tests, lint and debug build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :search:testDebugUnitTest \
            --tests 'me.rerere.search.CustomJsSearchServiceTest' \
            :app:testGithubDebugUnitTest \
            --tests 'me.rerere.rikkahub.data.model.CustomExtensionTest' \
            --tests 'me.rerere.rikkahub.data.ai.tools.local.CustomExtensionToolsTest' \
            --tests 'me.rerere.rikkahub.data.ai.tools.local.CustomToolHttpRuntimeTest' \
            --tests 'me.rerere.rikkahub.ui.pages.extensions.ExtensionBuilderStateTest' \
            :app:lintGithubDebug \
            :app:assembleGithubDebug

      - name: Upload focused verification reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastnap-custom-tool-api-runtime-verification
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/reports/tests/testGithubDebugUnitTest/**
            search/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-githubDebug.html
            app/build/reports/lint-results-githubDebug.xml
          if-no-files-found: warn
          retention-days: 14
