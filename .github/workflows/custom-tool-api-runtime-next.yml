name: Custom Tool API Runtime Verification

on:
  push:
    branches:
      - feature/custom-tool-api-runtime-next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-tool-api-runtime-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Provide CI-only Google Services configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "lastnap-ci",
              "storage_bucket": "lastnap-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.lastnap.app.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {}
              }
            ]
          }
          EOF

      - name: Run all Android library and app unit tests, lint, and debug assembly
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            testDebugUnitTest \
            :app:testGithubDebugUnitTest \
            :app:lintGithubDebug \
            :app:assembleGithubDebug

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedGithubDebugAndroidTest

      - name: Upload debug APK and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastnap-custom-tool-api-runtime-debug-verification
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/reports/tests/testGithubDebugUnitTest/**
            **/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-githubDebug.html
            app/build/reports/lint-results-githubDebug.xml
          if-no-files-found: warn
          retention-days: 14

  signed-release:
    name: Signed ARM64 release APK
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare private release inputs
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY_BASE64:-}" || -z "${SIGNING_CONFIG:-}" || -z "${GOOGLE_SERVICES_JSON:-}" ]]; then
            echo "::error::Required release configuration secrets are missing."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          test -s app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Assemble optimized signed GitHub release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease

      - name: Verify ARM64 APK, package identity, resources and signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$AAPT" || -z "$APKSIGNER" ]]; then
            echo "::error::Android aapt or apksigner was not found."
            exit 1
          fi

          mapfile -t ARM64_APKS < <(find app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' | sort)
          if [[ "${#ARM64_APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one ARM64 split APK; found ${#ARM64_APKS[@]}."
            find app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          APK="${ARM64_APKS[0]}"

          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/lastnap-badging.txt"
          grep -F "package: name='com.lastnap.app' versionCode='196' versionName='3.1.3'" "$RUNNER_TEMP/lastnap-badging.txt" >/dev/null

          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd ',' -)"
          if [[ "$ABI_LIST" != "arm64-v8a" ]]; then
            echo "::error::Expected an ARM64-only APK; detected native ABIs: ${ABI_LIST:-none}."
            exit 1
          fi

          "$AAPT" dump resources "$APK" > "$RUNNER_TEMP/lastnap-resources.txt"
          for RESOURCE in "mipmap/ic_launcher" "drawable-nodpi/appicon" "drawable-nodpi/noticon" "drawable/ic_launcher_background"; do
            if ! grep -Fq "$RESOURCE" "$RUNNER_TEMP/lastnap-resources.txt"; then
              echo "::error::Expected packaged resource not found: $RESOURCE"
              exit 1
            fi
          done

          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/lastnap-apksigner.txt" 2>&1

          mkdir -p stage7-artifacts
          cp "$APK" stage7-artifacts/LastNap-3.1.3-arm64-v8a.apk
          cp "$RUNNER_TEMP/lastnap-apksigner.txt" stage7-artifacts/apksigner-verification.txt
          cp "$RUNNER_TEMP/lastnap-badging.txt" stage7-artifacts/apk-badging.txt
          {
            echo "application_id=com.lastnap.app"
            echo "version_name=3.1.3"
            echo "version_code=196"
            echo "abi=$ABI_LIST"
            echo "apk_file=LastNap-3.1.3-arm64-v8a.apk"
            echo "sha256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "signing_certificate_digest=$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/lastnap-apksigner.txt" | head -n 1 | sed 's/^[[:space:]]*//')"
            echo "resource_table=verified"
            echo "apksigner=verified"
          } > stage7-artifacts/release-metadata.txt

          cat stage7-artifacts/release-metadata.txt

      - name: Upload signed ARM64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lastnap-custom-tool-api-runtime-signed-arm64-release
          path: |
            stage7-artifacts/LastNap-3.1.3-arm64-v8a.apk
            stage7-artifacts/release-metadata.txt
            stage7-artifacts/apksigner-verification.txt
            stage7-artifacts/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
